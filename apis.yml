description: 'Consolidated Edison, Inc. (Con Edison) is a Fortune 500 investor-owned utility providing
  electric, natural gas and steam service to New York City and Westchester County. It runs no general-purpose
  developer portal; its one programmatic surface is Green Button Connect My Data - branded Share
  My Data - a NAESB ESPI (REQ.21) / Green Button V3.3 API that lets a registered third party retrieve
  a customer''s interval usage, billing and account data once that customer consents. The contract
  is published: Con Edison links a Swagger 2.0 definition (DCX GBC API V2, 37 operations over UsagePoint,
  MeterReading, IntervalBlock, ReadingType, UsageSummary, RetailCustomer, Batch and RealTime) and
  a Postman collection from its public onboarding document; production base is https://api.coned.com/gbc/espi/1_1.
  Access is free but not self-service - a Data Security Agreement and a 30-60 day onboarding come
  first. Orange & Rockland runs the identical contract.'
