  description: Green Button Connect My Data is the OAuth2-based ESPI service that lets Con Edison
    customers authorize a registered third party to receive their interval energy usage and account
    data on a recurring basis. Third parties register through Con Edison's onboarding process to
    obtain client credentials, then exchange them for access tokens that retrieve ESPI Atom/XML resources
    for usage points, meter readings, and electric power usage summaries.
  baseURL: https://api.coned.com/gbc/espi/1_1
