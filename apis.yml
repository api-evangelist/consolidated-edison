description: >-
  Consolidated Edison, Inc. (NYSE: ED) is a Fortune 500 utility holding company headquartered in New
  York City. It publishes no APIs of its own; it operates through its regulated subsidiaries,
  principally Consolidated Edison Company of New York (CECONY), which serves electric, gas and steam
  customers in New York City and Westchester County, and Orange and Rockland Utilities (O&R), along
  with Con Edison Transmission. The developer surface - Green Button Connect My Data (Share My Data)
  and Green Button Download My Data, both served from coned.com - belongs to CECONY and is profiled
  under the con-edison provider. This profile covers the holding company only.

