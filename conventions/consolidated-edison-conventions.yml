data_quality:
  reading_quality: >-
    A QualityOfReading value of 17 signifies good, validated data. Historical
    interval data is finalized and validated; real-time interval data is
    provisional, unvalidated and explicitly not billing quality.
  scaling: >-
    Every value must be scaled by the ReadingType powerOfTenMultiplier:
    actual = IntervalReading.value x 10^powerOfTenMultiplier. Con Edison's
    current multipliers are 3 for electric and 0 for gas; uom 72 is watt-hours,
    uom 119 is cubic feet.
  availability: >-
    Historical interval data: 80-90% within 24 hours, 99% within 3 days, 99.8%
    within 7 days. Real-time electricity data lags 45 minutes from request
    processing time.
  intervals:
    electric_commercial_ami: 5-minute
    electric_residential_ami: 15-minute
    electric_legacy_interval: 15-minute
    gas_ami: 1-hour
    non_interval: monthly
