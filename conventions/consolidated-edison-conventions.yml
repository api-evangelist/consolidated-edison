idempotency:
  supported: false
  coverage: na
  applicable: false
  note: >-
    The surface has no business write operation. 36 of 37 operations are GET
    reads of ESPI resources; the one non-GET business operation
    (getAllElectricPowerUsageSummariesById) is a POST that reads a usage
    summary, and POST /oauth/Token mints credentials. There is nothing to
    replay-protect, so no Idempotency-Key mechanism exists or is needed and no
    Idempotency pointer is emitted.
  duplicate_request_handling: >-
    Batch requests are the closest analogue: Con Edison rejects a duplicate
    batch request while one is still pending, and if the same batch parameters
    are re-requested within two days the platform returns the cached response
    prepared for the original request.
reversibility:
  applicable: false
  grade: na
  note: >-
    Read-only API. The only state a third party creates is an OAuth
    authorization, and that is created and revoked by the CUSTOMER in Con
    Edison's My Account portal, not by an API call. There is no cancel, refund,
    void or delete operation in the specification to reverse.
  customer_side_revocation:
    actor: retail customer
    mechanism: >-
      "Stop Sharing My Data" in the Con Edison / Orange & Rockland online
      account revokes an authorization immediately.
    automatic_expiry: >-
      An authorization is revoked automatically if it goes unused for 365 days;
      a "share one time" authorization expires 24 hours after it is initiated;
      a "share until a date" authorization expires on that date.
    docs: >-
      https://www.coned.com/en/accounts-billing/share-energy-usage-data/share-my-data
dry_run_mode:
  applicable: false
  note: >-
    No write surface to rehearse. Con Edison instead provides a full separate
    test environment — see sandbox/consolidated-edison-sandbox.yml.
asynchronous:
  pattern: request / 202 / callback notification
  detail: >-
    Batch and RealTime/Batch requests are processed asynchronously. HTTP 202
    signals the Data Custodian accepted the request and needs time to assemble
    the response; when assembly completes Con Edison POSTs a notification to
    the third party's registered third_party_notify_uri containing a BatchList
    of resource URLs to GET.
  gotcha: >-
    The download URL is embedded in an XML response and carries XML-escaped
    characters (&amp;) that must be unescaped before the URL is invoked.
  retention: >-
    A batch response must be retrieved within 2 days of notification; after
    that it is deleted and a re-request behaves as a new batch.
  size: Responses larger than 200 MB are chunked into multiple files.
  latency: >-
    Notifications typically arrive within one hour; up to 24 hours under heavy
    load.
  catalog: asyncapi/consolidated-edison-webhooks.yml
