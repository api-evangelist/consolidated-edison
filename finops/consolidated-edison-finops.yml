meters:
  - name: kwh_delivered
    description: Electricity delivered, kilowatt-hours, per regulated tariff
    unit: kWh
    aggregation: sum
    dimensions:
      - service_class
      - rate_zone
      - account
  - name: therms_delivered
    description: Natural gas delivered, therms
    unit: therm
    aggregation: sum
    dimensions:
      - service_class
      - account
  - name: gbc_authorizations
    description: Active Green Button Connect My Data authorizations (no charge)
    unit: authorization
    aggregation: count
    dimensions:
      - third_party
principles:
  - name: Visibility
    description: Use Con Edison's My Account portal and Green Button Download My Data exports to surface
      consumption per meter; the GBC feed gives Third Parties customer-consented near-real-time usage.
  - name: Allocation
    description: Allocate energy spend by physical meter / account / facility; for multi-tenant facilities
      use submetering and ESPI feeds per consenting customer.
  - name: Optimization
    description: Demand-response programs, time-of-use rate selection, energy-efficiency rebates, and
      gas-vs-electric optimization are the primary cost levers; the GBC feed surfaces interval data needed
      to drive these decisions.
  - name: Accountability
    description: Facilities / sustainability teams typically own utility spend; Third-Party authorized
      services own the operational accuracy of the GBC integration.
