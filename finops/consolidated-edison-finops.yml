description: 'FOCUS-aligned FinOps for Consolidated Edison: regulated utility delivering energy under
  NY PSC tariffs; programmatic surface (Green Button Connect My Data) is consent-based and not separately
  billed. FinOps focuses on the underlying utility bill rather than API consumption.'
notes: Con Edison's commercial product is regulated electric / gas / steam delivery, billed through utility
  tariffs. The Green Button Connect feed itself is not metered or priced.
sources:
  - https://www.coned.com
  - https://www.greenbuttondata.org
billingModel:
  pricingCategory: Regulated Utility Tariff
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Tax
    - Adjustment
focusColumns:
  ServiceName: Consolidated Edison
  ServiceCategory: Regulated Utility / Energy
  ProviderName: Consolidated Edison
