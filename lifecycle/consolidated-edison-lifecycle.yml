authorization_expiry:
  access_token: 60 minutes
  refresh_token: expires after one year if never used
  authorization_unused: automatically revoked after 365 days without access
  one_time_authorization: expires 24 hours after it is initiated
  registration: >-
    A third-party registration, once approved, remains valid indefinitely.
    Registration testing must complete within 90 days of acceptance or the
    registration is put on hold; no response within 90 days of the business
    welcome email withdraws the submission.
