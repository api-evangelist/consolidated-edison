status_page: null
status_page_note: >-
  Con Edison publishes an electric outage map (https://outagemap.coned.com/external/default.html)
  for its utility service, but there is no status page for the Green Button
  Connect API. The specification does expose a health operation
  (GET /resource/ReadServiceStatus, operationId readServiceStatus) which is
  authenticated — it returned 401 anonymously on 2026-09-05 — so it is a
  monitoring endpoint for onboarded third parties, not a public status surface.
  No StatusPage pointer is emitted.
