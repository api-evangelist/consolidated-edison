plans:
  - id: consolidated-edison-green-button
    name: Green Button Connect My Data
    type: free
    description: NAESB ESPI-compliant data feed authorized by the customer via Con Edison's Green Button
      Connect My Data portal. Access is provided to authorized Third Parties under the New York PSC framework
      and standard ESPI terms; there is no metered pricing.
    entries:
