description: Con Edison delivers programmatic data access exclusively through the Green Button Connect
  My Data (GBC) program using the NAESB Energy Services Provider Interface (ESPI) standard. Access is
  free for authorized third parties once the underlying customer grants consent through Con Edison's
  GBC authorization portal; there is no API tier pricing. Energy delivery itself is regulated tariff-based
  retail pricing and is not surfaced via developer plans.
notes: Con Edison's developer surface is the regulated Green Button Connect My Data feed (NAESB ESPI).
  No commercial API pricing exists; consent and terms are governed by the New York Public Service Commission
  framework.
