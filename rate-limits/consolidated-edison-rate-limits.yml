description: Con Edison does not publish public rate-limit numbers for the Green Button Connect My Data
  (NAESB ESPI) feed. ESPI implementations typically apply per-Third-Party throttling on the polling /
  subscribe endpoints; specific values are governed by the GBC Third Party onboarding agreement.
notes: Specific RPS/RPM thresholds for the GBC feed are not publicly published; reconcile via the GBC
  Third Party onboarding documentation.
sources:
  - https://www.coned.com
  - https://www.greenbuttondata.org
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Green Button Connect Polling Limit
    scope: third-party
    metric: varies
    limit: 'see GBC Third Party onboarding agreement'
    notes: Polling cadence and per-Third-Party limits are negotiated through Con Edison's GBC onboarding
      process per the NAESB ESPI framework.
policies:
  - name: ESPI Compliance
    description: Clients must conform to the NAESB ESPI standard for authorization, retrieval, and revocation
      semantics.
  - name: Customer Consent
    description: All access is consent-based — revoking customer authorization terminates the feed.
  - name: Backoff Strategy
    description: Use exponential backoff with jitter on 429 / 503; honor Retry-After when present.
